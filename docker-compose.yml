version: '3.8'

services:
  farmer-service:
    build: ./farmer-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=development
      - SERVICE_NAME=farmer-service

  buyer-service:
    build: ./buyer-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - NODE_ENV=development
      - SERVICE_NAME=buyer-service

  marketplace-service:
    build: ./marketplace-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - NODE_ENV=development
      - SERVICE_NAME=marketplace-service

  logistics-service:
    build: ./logistics-service
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - NODE_ENV=development
      - SERVICE_NAME=logistics-service

  prediction-service:
    build: ./prediction-service
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - NODE_ENV=development
      - SERVICE_NAME=prediction-service

  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - FARMER_SERVICE_URL=http://farmer-service:5001
      - BUYER_SERVICE_URL=http://buyer-service:5002
      - MARKETPLACE_SERVICE_URL=http://marketplace-service:5003
      - LOGISTICS_SERVICE_URL=http://logistics-service:5004
      - PREDICTION_SERVICE_URL=http://prediction-service:5005
    depends_on:
      - farmer-service
      - buyer-service
      - marketplace-service
      - logistics-service
      - prediction-service
